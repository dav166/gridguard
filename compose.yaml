services:
  postgres:
    image: postgres:17-alpine
    container_name: gridguard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridguard}
      POSTGRES_USER: ${POSTGRES_USER:-gridguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridguard_dev_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - gridguard_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-gridguard} -d ${POSTGRES_DB:-gridguard}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  gridguard_postgres_data:
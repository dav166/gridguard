[project]
name = "gridguard-api"
version = "0.1.0"
description = "FastAPI backend for GridGuard Safety OS"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard]>=0.128.8",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.11.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8.4.2",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
